name: Windows Release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as a GitHub release for in-app updates
        type: boolean
        default: false
      notes:
        description: Release notes shown in the update window
        type: string
        default: ''
  push:
    branches:
      - ayu-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 360

    permissions:
      contents: write

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      ARCH: "x64"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          rem Caches and built libraries keep absolute paths from before the repository rename.
          mkdir D:\a\AyuGramDesktop\AyuGramDesktop
          mklink /d D:\a\AyuGramDesktop\AyuGramDesktop\TBuild %userprofile%\TBuild
          echo TBUILD=D:\a\AyuGramDesktop\AyuGramDesktop\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=D:\a\AyuGramDesktop\AyuGramDesktop\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Free runner disk space.
        shell: pwsh
        run: |
          $unused = @(
            'C:\Android',
            'C:\ghcup',
            'C:\Rust',
            'C:\Julia',
            'C:\Miniconda',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\CodeQL'
          )
          foreach ($path in $unused) {
            if (Test-Path $path) {
              Start-Process -FilePath cmd.exe -ArgumentList "/c rmdir /s /q `"$path`"" -WindowStyle Hidden
            }
          }

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=AyuGramDesktop" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          CREDENTIALS=$TBUILD/$REPO_NAME/docs/api_credentials.md
          API_ID="$(grep -m1 'API_ID' $CREDENTIALS | sed -r 's/.*`(.*)`.*/\1/')"
          API_HASH="$(grep -m1 'API_HASH' $CREDENTIALS | sed -r 's/.*`(.*)`.*/\1/')"
          echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ env.ARCH }}
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ env.ARCH }}-release-third-party-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ env.ARCH }}-release-third-party-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-libs-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ env.ARCH }}-release-libs-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ env.ARCH }}-release-libs-

      - name: Restore Qt cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-qt-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ env.ARCH }}-release-qt-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ env.ARCH }}-release-qt-

      - name: Remember libraries state.
        id: libs-before
        shell: bash
        run: echo "hash=$(find "$TBUILD/ThirdParty/cache_keys" "$LibrariesPath/cache_keys" -type f -print0 2>/dev/null | sort -z | xargs -0 -r cat | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Libraries.
        id: libraries
        timeout-minutes: 290
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Check libraries state.
        id: libs-after
        if: always()
        shell: bash
        run: echo "hash=$(find "$TBUILD/ThirdParty/cache_keys" "$LibrariesPath/cache_keys" -type f -print0 2>/dev/null | sort -z | xargs -0 -r cat | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Save ThirdParty cache.
        if: always() && steps.libs-after.outputs.hash != steps.libs-before.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries cache.
        if: always() && steps.libs-after.outputs.hash != steps.libs-before.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Qt cache.
        if: always() && steps.libs-after.outputs.hash != steps.libs-before.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop if libraries are not ready.
        if: steps.libraries.outcome != 'success'
        run: exit 1

      - name: Restore build folder cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-out-${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.OS }}-${{ env.ARCH }}-release-out-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ env.ARCH }}-release-out-

      - name: Prepare incremental build.
        shell: bash
        run: python "$TBUILD/$REPO_NAME/.github/scripts/prepare_incremental.py" "$TBUILD/$REPO_NAME"

      - name: AyuGram build.
        id: build
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          -G "Ninja Multi-Config" ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D CHICKENGRAM_BUILD=%GITHUB_RUN_NUMBER%

          cmake --build ..\out --config Release --parallel -- -k 0

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Chickengram.exe artifact/

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: Chickengram-x64-release
          path: artifact\
          retention-days: 7

      - name: Publish release.
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          SHA256="$(sha256sum artifact/Chickengram.exe | awk '{ print $1 }')"
          if [ -z "$NOTES" ]; then
            NOTES="$(git -C "TBuild/$REPO_NAME" log -1 --format=%s)"
          fi
          printf '%s\n\nSHA256: %s\n' "$NOTES" "$SHA256" > release_notes.txt
          gh release create "build-$GITHUB_RUN_NUMBER" artifact/Chickengram.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Чикенграм — сборка $GITHUB_RUN_NUMBER" \
            --notes-file release_notes.txt

      - name: Remember built commit.
        if: steps.build.outcome == 'success'
        run: echo %GITHUB_SHA%>%TBUILD%\%REPO_NAME%\out\ayu_build_sha.txt

      - name: Save build folder cache.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ env.ARCH }}-release-out-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
